# Drafts an in-progress GitHub Release from merged PRs. Categories/template
# live in .github/release-drafter.yml (local, repo-specific). See
# reusable-release-drafter.yml for the shared runner.
name: Release Drafter

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  update-release-draft:
    # A called workflow can't exceed its caller's permissions; the shared job
    # needs contents: write to create/update the draft release.
    permissions:
      contents: write
      pull-requests: write
    uses: and3rn3t/.github/.github/workflows/reusable-release-drafter.yml@0415d76d5dfdf1dec81d4756d411850057f38618 # v1
