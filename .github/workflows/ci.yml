# Node.js test pipeline for the standalone skill.
# Python variant at the bottom — swap the jobs if this is a Python project.
#
# Shorter alternative — call the shared reusable workflow instead:
#   jobs:
#     quality:
#       uses: and3rn3t/.github/.github/workflows/reusable-node-verify.yml@v1
#       with:
#         command: pnpm test

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          standalone: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Tests
        run: pnpm test

