# Quality gate: lint, format, type-check, tests, and skill bundle drift.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Plist decoding is pure TypeScript, so every OS must inspect every fixture identically.
        # macOS also cross-checks the decoder against /usr/bin/plutil (test-only).
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          standalone: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Validate
        run: pnpm validate

  workflow-lint:
    # actionlint checks workflow syntax and expressions; zizmor audits them for security problems
    # (credential persistence, permissions, cache poisoning, injection, risky action pins).
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.30.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: zizmor
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --format github --min-severity low .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  skill-runtime:
    # The bundled skill promises Node 22 support; run it there without dev dependencies.
    name: Skill on Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Inspect fixtures with the standalone script
        run: |
          for fixture in mixed-actions.json mixed-actions.plist mixed-actions.binary.plist; do
            node skills/shortcuts-doctor/scripts/inspect-shortcut.mjs -- "tests/fixtures/${fixture}" > /dev/null
          done

  npm-tarball:
    # Validates what users install from npm, not the workspace: pack, install, run the bin.
    name: npm tarball (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          standalone: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Pack, install, and run the CLI
        run: scripts/smoke-pack.sh

  web-e2e:
    # Drives the built web app in real Chromium against `wrangler dev`, so the same headers and CSP
    # apply as in production: no request after load, nothing stored, keyboard access, accessibility.
    name: Web end-to-end (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          standalone: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Build the web app
        run: pnpm --filter @shortcuts-doctor/web build
      - name: Check the deploy configuration
        # Validates wrangler.jsonc and the assets directory without credentials or network.
        run: pnpm --filter @shortcuts-doctor/web exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-run"
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Install Chromium
        run: pnpm --filter @shortcuts-doctor/web exec playwright install --with-deps chromium
      - name: Run the end-to-end tests
        run: pnpm --filter @shortcuts-doctor/web e2e
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
