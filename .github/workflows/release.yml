# Release workflow — creates a GitHub Release when a version tag is pushed.
#
# Usage:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Attaches the installable skill directory as a zip. npm publishing of the CLI
# is planned for roadmap milestone M1.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          standalone: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Validate
        run: pnpm validate

      - name: Package skill
        run: |
          mkdir -p dist
          (cd skills && zip -r "../dist/shortcuts-doctor-skill-${GITHUB_REF_NAME}.zip" shortcuts-doctor)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/shortcuts-doctor-skill-*.zip
