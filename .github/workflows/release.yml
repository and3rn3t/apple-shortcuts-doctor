# Release workflow — creates a GitHub Release when a version tag is pushed.
#
# Usage (see CONTRIBUTING.md#releasing):
#   bump "version" in packages/cli/package.json and packages/core/package.json
#   git tag vX.Y.Z
#   git push origin vX.Y.Z
#
# The first step fails unless the tag matches both package versions.
# After publishing, verify-npm installs the release from the registry and checks it.
# Attaches the installable skill directory as a zip. npm publishing of the CLI
# is opt-in via the PUBLISH_NPM repository variable (see the publish-npm job).

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check tag matches package versions
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          for manifest in packages/cli/package.json packages/core/package.json; do
            package_version="$(node -p "require('./${manifest}').version")"
            if [ "$package_version" != "$tag_version" ]; then
              echo "::error file=${manifest}::Tag ${GITHUB_REF_NAME} does not match version ${package_version} in ${manifest}."
              exit 1
            fi
          done

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          standalone: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Validate
        run: pnpm validate

      - name: Package skill
        run: |
          mkdir -p dist
          (cd skills && zip -r "../dist/shortcuts-doctor-skill-${GITHUB_REF_NAME}.zip" shortcuts-doctor)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/shortcuts-doctor-skill-*.zip

  publish-npm:
    name: Publish CLI to npm
    # Opt-in: set repository variable PUBLISH_NPM=true after configuring npm trusted publishing
    # (npmjs.com -> package settings -> Trusted Publisher -> this repo, workflow release.yml).
    if: vars.PUBLISH_NPM == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          standalone: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0
      - name: Fail if this version is already on npm
        # Only an explicit E404 means the version is free; auth, registry, or network errors fail.
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if lookup="$(npm view "shortcuts-doctor@${version}" version 2>&1)"; then
            echo "::error::shortcuts-doctor@${version} is already published. Bump the version and tag again."
            exit 1
          fi
          if ! grep -q 'E404' <<<"$lookup"; then
            echo "$lookup"
            echo "::error::Could not check whether shortcuts-doctor@${version} is published."
            exit 1
          fi
      - name: Publish (prepack builds the bundle)
        run: pnpm --filter shortcuts-doctor publish --no-git-checks

  verify-npm:
    name: Verify the published package
    # Install what was just published from the registry, exactly as a user would, so a broken or
    # unattested publish fails the release instead of looking green.
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install from npm and inspect the fixtures
        run: scripts/verify-published.sh "${GITHUB_REF_NAME#v}"
