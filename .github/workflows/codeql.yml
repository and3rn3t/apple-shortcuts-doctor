# Calls the shared reusable CodeQL workflow (and3rn3t/.github).
# CodeQL's `javascript` extractor also analyzes TypeScript, so listing both ran the same analysis
# twice (identical rules and results). One entry keeps the existing /language:javascript history.
name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    uses: and3rn3t/.github/.github/workflows/reusable-codeql.yml@99fae926f05867cc98ec7007b9fce8c1fd125b53 # v1
    with:
      languages: '["javascript"]'
