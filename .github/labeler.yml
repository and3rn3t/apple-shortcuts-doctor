# Applied by .github/workflows/labeler.yml on every PR.

documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md', 'docs/**']

ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**']

dependencies:
  - changed-files:
      - any-glob-to-any-file: ['package.json', '**/package.json', 'pnpm-lock.yaml', 'renovate.json']

core:
  - changed-files:
      - any-glob-to-any-file: ['packages/core/**']

cli:
  - changed-files:
      - any-glob-to-any-file: ['packages/cli/**']

web:
  - changed-files:
      - any-glob-to-any-file: ['apps/web/**']

skill:
  - changed-files:
      - any-glob-to-any-file: ['skills/**']

tests:
  - changed-files:
      - any-glob-to-any-file: ['tests/**', '**/test/**', '**/*.test.*', '**/*.spec.*']
